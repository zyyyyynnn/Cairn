[package]
name = "xtask"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "CairnXtask"
path = "src/main.rs"

[features]
default = ["bench", "package"]
bench = ["dep:cairn-core", "dep:cairn-ntfs", "dep:cairn-service", "dep:tempfile"]
package = ["dep:cairn-protocol", "dep:cairn-setup", "dep:sha2"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
cairn-core = { workspace = true, optional = true }
cairn-ntfs = { workspace = true, optional = true }
cairn-protocol = { workspace = true, optional = true }
cairn-service = { workspace = true, optional = true }
cairn-setup = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource.workspace = true

[lints]
workspace = true
