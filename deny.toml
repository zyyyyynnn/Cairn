# Dependency policy for Cairn (Windows x64).
# Vulnerabilities and yanked crates remain denied by cargo-deny defaults.
# The ignores below are transitive, unmaintained dependencies of the locked
# gpui-kit/gpui-pre stack; no safe upgrade exists in that stack. Remove an
# ignore as soon as the upstream dependency is upgraded.

[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0384", reason = "instant is pulled by gpui-kit 0.8; no safe upgrade, no direct use" },
    { id = "RUSTSEC-2024-0436", reason = "paste is pulled by gpui-component/gpui-pre; no safe upgrade, no direct use" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is pulled by gpui-kit's SVG/usvg stack; no safe upgrade" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is pulled by gpui-kit's SVG/font stack; no safe upgrade" },
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "zlib-acknowledgement",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
