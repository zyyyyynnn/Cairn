[workspace]
resolver = "3"
members = [
    "crates/cairn-core",
    "crates/cairn-protocol",
    "crates/cairn-ntfs",
    "crates/cairn-content",
    "crates/cairn-service",
    "crates/cairn-worker",
    "crates/cairn-client",
    "crates/cairn-app",
    "crates/cairn-cli",
    "crates/cairn-ui",
    "crates/cairn-setup",
    "crates/cairn-setup-bin",
    "xtask",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
authors = ["Cairn Contributors"]
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# Internal workspace crates
cairn-core = { path = "crates/cairn-core" }
cairn-protocol = { path = "crates/cairn-protocol" }
cairn-ntfs = { path = "crates/cairn-ntfs" }
cairn-content = { path = "crates/cairn-content" }
cairn-service = { path = "crates/cairn-service" }
cairn-worker = { path = "crates/cairn-worker" }
cairn-client = { path = "crates/cairn-client" }
cairn-ui = { path = "crates/cairn-ui" }
cairn-setup = { path = "crates/cairn-setup" }

# Serialization & IPC
serde = { version = "1.0", features = ["derive"] }
semver = "1.0"
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde_json = "1.0"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "system-proxy"] }
toml = "1.2"

# Concurrency & Performance
rayon = "1.12"
memchr = "2.8"
regex = "1.13"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs", "signal"] }

# Windows OS APIs
windows = { version = "0.62.2" }
windows-service = "0.8.1"

# Content Search & Text
tantivy = { version = "0.27.0", default-features = false, features = ["mmap", "lz4-compression", "columnar-zstd-compression"] }
chardetng = "1.0.0"
encoding_rs = "0.8.44"
zip = { version = "9.8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
quick-xml = "0.42"
lopdf = { version = "0.47", default-features = false }

# GUI & Desktop
# `component` carries the shell this app is built from (Sidebar, Toolbar, Table, Menu, StatusBar,
# theme tokens). gpui-kit 0.10 owns the matching gpui-base/gpui-component versions; the application
# does not list them directly.
gpui-kit = { version = "0.10.0", default-features = false, features = ["assets", "component"] }
tray-icon = { version = "0.26.1", default-features = false }
global-hotkey = "0.10"
fluent-bundle = "0.16"
unic-langid = "0.9"

# CLI & Tooling
clap = { version = "4.6", features = ["derive"] }
csv = "1.4"
crc32fast = "1.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1.12"
thiserror = "2.0"
tempfile = "3.27"
winresource = "0.1.34"

# The local GUI build (README) needs optimized dependencies: unoptimized GPUI
# repaints the table at a few frames per second. CI keeps the plain dev profile.
[profile.dev-ui]
inherits = "dev"
opt-level = 1

[profile.dev-ui.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "thin"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
elided_lifetimes_in_paths = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
await_holding_lock = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

