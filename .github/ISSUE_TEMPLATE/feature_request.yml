name: 功能建议 / Feature Request
description: 为 Cairn 提出新功能、性能优化或交互设计改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        欢迎为 Cairn 提交特性建议！请详细说明新功能的使用场景、期望交互及预期收益。
  - type: textarea
    id: problem
    attributes:
      label: 场景背景与痛点 / Background & Problem
      description: 描述您在何种工作流中遇到瓶颈，或者为何需要该项新功能。
      placeholder: 例如：在管理海量临时工程文件时，缺少按目录深度的过滤能力，导致...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案与设计 / Proposed Solution
      description: 您期望的具体实现方式、交互形式或命令行参数设计。
      placeholder: 希望增加...选项/语法，预期交互方式是...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与现有替代品 / Alternatives Considered
      description: 是否尝试过其他替代工具或变通方式？为何现有方案不够理想？
      placeholder: 曾尝试使用...，但存在以下限制...
    validations:
      required: false
  - type: dropdown
    id: module
    attributes:
      label: 目标模块 / Target Scope
      description: 该特性建议主要涉及的系统层面。
      options:
        - "App / UI (界面与交互体验)"
        - "Treemap (磁盘空间树图可视化)"
        - "Recycle Bin (回收站文件管理)"
        - "Core / Indexing (搜索算法与索引性能)"
        - "Service / Daemon (后台守护与同步服务)"
        - "CLI / Tooling (命令行工具与脚本集成)"
        - "Packaging / Distribution (打包安装与分发部署)"
        - "Documentation (技术规范与文档)"
        - "Other / Unknown (其他或综合性改进)"
    validations:
      required: true
