name: 缺陷报告 / Bug Report
description: 报告 Cairn 运行中出现的崩溃、搜索异常、显示错误或与预期不符的行为
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交缺陷反馈！提交前请确认该问题在最新发布版本中依然存在，并尽量提供清晰的复现步骤与关键日志。
  - type: textarea
    id: description
    attributes:
      label: 缺陷简述 / Summary
      description: 请简明扼要地概述问题现象、发生频率（必现/偶发）及异常表现。
      placeholder: 例如：在特定搜索关键词下，虚拟表格发生空白且无法继续滚动...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Steps to Reproduce
      description: 触发该问题的具体操作路径与前置条件。
      placeholder: |
        1. 启动 Cairn...
        2. 输入搜索关键词...
        3. 进行特定操作（如滚动、点击、右键菜单、缩放等）...
        4. 观察到异常现象...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为 / Expected Behavior
      description: 按照设计或常理，预期应当发生什么。
      placeholder: 预期虚拟表格平滑加载下一页结果，界面保持响应...
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为 / Actual Behavior
      description: 实际发生的情况（错误现象、卡顿、无响应或崩溃）。
      placeholder: 实际出现白屏/报错/数据未及时刷新...
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: 所属模块 / Affected Module
      description: 请选择问题发生的组件范围（若不确定可选择其他）。
      options:
        - "App / UI (界面交互与虚拟列表)"
        - "Treemap (磁盘空间树图可视化)"
        - "Recycle Bin (回收站文件管理)"
        - "Core / Indexing (NTFS MFT 扫描与 USN 同步)"
        - "Service / IPC (后台守护服务与管道通信)"
        - "CLI / Client (命令行客户端工具)"
        - "Installer / Packaging (安装程序与系统服务注册)"
        - "Other / Unknown (其他或跨模块问题)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境 / Environment
      description: 操作系统版本、Cairn 版本、驱动器文件系统及执行权限。
      placeholder: "Windows 11 23H2 (x64) / Cairn v0.1.2 / NTFS 驱动器 (C:, D:) / 普通用户权限"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志与截图证据 / Logs or Screenshots
      description: 粘贴相关错误堆栈、控制台输出，或直接粘贴/拖拽截图（支持原生 Markdown 渲染）。
      placeholder: 可以直接粘贴图片，或使用 ```log 代码块包裹日志内容...
    validations:
      required: false
