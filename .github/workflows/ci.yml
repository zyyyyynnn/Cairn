name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('ref-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Rust caches are keyed by lockfiles and the toolchain, so workflow-only edits
# reuse the compiled release and debug artifacts.

jobs:
  changes:
    name: Detect documentation-only change
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          # `some` ignores negated patterns; `every` keeps a docs-only PR out of `code`.
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!README.md'
              - '!docs/**'
              - '!**/*.md'
      - id: classify
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" && "${{ steps.filter.outputs.code }}" == "false" ]]; then
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

  quality:
    name: Code Quality & Static Analysis
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-debug
          add-job-id-key: false
          cache-bin: false
      - name: Clippy lint
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust documentation
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - name: Internationalization check
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo run -p xtask -- check-i18n
      - name: Documentation links
        run: cargo run -p xtask -- check-docs

  deny:
    name: Dependency Policy
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only change; dependency checks are not required."
      - name: Checkout repository
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format check
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo fmt --all --check
      - name: Dependency policy
        if: needs.changes.outputs.docs_only != 'true'
        uses: EmbarkStudios/cargo-deny-action@v2

  test-layers:
    name: "Test / ${{ matrix.name }}"
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core & Protocol
            command: cargo test -p cairn-protocol -p cairn-client -p cairn-core -p cairn-ui
          - name: Content & Filesystem
            command: cargo test -p cairn-ntfs -p cairn-content
          - name: Service
            command: cargo test -p cairn-service
          - name: Desktop
            command: cargo test -p cairn-app
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-debug
          add-job-id-key: false
          cache-bin: false
          save-if: false
      - name: Run tests
        run: ${{ matrix.command }}

  tooling:
    name: Test / Tooling
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-debug
          add-job-id-key: false
          cache-bin: false
          save-if: false
      - name: Run tests
        run: cargo test -p cairn-cli -p cairn-worker -p cairn-setup -p xtask
      - name: Locate installer test binary
        shell: pwsh
        run: |
          $binary = Get-ChildItem -Path target\debug\deps -Filter "xtask-*.exe" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $binary) { throw "The installer test binary was not produced." }
          Copy-Item -LiteralPath $binary.FullName -Destination package-test.exe
      - name: Upload installer test binary
        uses: actions/upload-artifact@v4
        with:
          name: package-test-binary
          path: package-test.exe
          retention-days: 1

  test:
    name: Domain & System Test Suite
    needs: [changes, test-layers, tooling]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify every test layer
        run: |
          if [[ "${{ needs.changes.outputs.docs_only }}" == "true" ]]; then
            echo "Documentation-only change; no test layer is required."
            exit 0
          fi
          if [[ "${{ needs.test-layers.result }}" != "success" || "${{ needs.tooling.result }}" != "success" ]]; then
            echo "At least one test layer did not succeed."
            exit 1
          fi

  release_runtime:
    name: Release / Runtime
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          add-job-id-key: false
          cache-bin: false
          cache-workspace-crates: true
          save-if: "${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') }}"
      - name: Build runtime binaries
        run: cargo build --release -p cairn-app -p cairn-service -p cairn-cli -p cairn-worker
      - name: Upload runtime binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-runtime-binaries
          path: |
            target/release/Cairn.exe
            target/release/CairnService.exe
            target/release/CairnCli.exe
            target/release/CairnWorker.exe
          if-no-files-found: error
          retention-days: 1

  release_installer:
    name: Release / Installer
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-installer
          add-job-id-key: false
          cache-bin: false
          cache-workspace-crates: true
          save-if: "${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.actor != 'dependabot[bot]') }}"
      - name: Build installer binaries
        run: cargo build --release -p cairn-setup-bin
      - name: Upload installer binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-installer-binaries
          path: |
            target/release/CairnSetup.exe
            target/release/CairnUninstall.exe
            target/release/CairnInstallGuard.exe
          if-no-files-found: error
          retention-days: 1

  package:
    name: Installer Package
    needs: [changes, deny, quality, release_runtime, release_installer, tooling]
    if: always() && (needs.changes.outputs.docs_only == 'true' || (needs.deny.result == 'success' && needs.quality.result == 'success' && needs.release_runtime.result == 'success' && needs.release_installer.result == 'success' && needs.tooling.result == 'success'))
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Documentation-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Documentation-only change; installer packaging is not required."
      - name: Checkout repository
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v7
      - name: Download runtime binaries
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-runtime-binaries
          path: release-bin
      - name: Download installer binaries
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: release-installer-binaries
          path: release-bin
      - name: Download installer test binary
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/download-artifact@v4
        with:
          name: package-test-binary
          path: package-test-bin
      - name: Install WiX
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          dotnet tool install --global wix --version 5.0.2
          echo "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Add the WiX UI extension
        if: needs.changes.outputs.docs_only != 'true'
        run: wix extension add -g WixToolset.Util.wixext/5.0.2
      - name: Build and validate the installer
        if: needs.changes.outputs.docs_only != 'true'
        env:
          CAIRN_BIN_DIR: ${{ github.workspace }}/release-bin
        run: |
          & "$env:GITHUB_WORKSPACE\package-test-bin\package-test.exe" real_package_builds_msi_and_setup --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
