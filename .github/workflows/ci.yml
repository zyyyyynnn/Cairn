name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Code Quality & Static Analysis
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Documentation check
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Internationalization check
        run: cargo run -p xtask -- check-i18n

      - name: Dependency policy
        uses: EmbarkStudios/cargo-deny-action@v2

  test:
    name: Domain & System Test Suite
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: "Layer 1: Core Domain & Protocol Models"
        run: cargo test -p cairn-protocol -p cairn-ntfs -p cairn-content -p cairn-client -p cairn-core -p cairn-ui

      - name: "Layer 2: Service Engine & System IPC"
        run: cargo test -p cairn-service

      - name: "Layer 3: Desktop UI & State Reconciliation"
        run: cargo test -p cairn-app

      - name: "Layer 4: Tooling & Release Verification"
        run: cargo test -p cairn-cli -p cairn-worker -p cairn-setup -p xtask
